<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Collections — Halden & Vane</title>
<meta name="description" content="Suits, tailoring and accessories, made to commission.">
<meta property="og:title" content="Collections — Halden & Vane">
<meta property="og:description" content="Suits, tailoring and accessories, made to commission.">
<meta property="og:image" content="/frames/d/180.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0a08;color:#efe8dc;font-family:'Geist',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#c9a46a;text-decoration:none}a:hover{color:#efe8dc}
*{box-sizing:border-box}
</style>
</helmet>

<header style="position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 24px;padding:clamp(14px,2.4vw,24px) clamp(16px,4vw,56px);background:#0b0a08;transform:translateZ(0);border-bottom:1px solid #efe8dc14">
  <a href="/" style="font-family:'Geist',sans-serif;font-size:22px;letter-spacing:.04em;color:#efe8dc">Halden <span style="color:#c9a46a">&amp;</span> Vane</a>
  <nav style="display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%;white-space:nowrap;gap:clamp(14px,3vw,40px);font-size:clamp(10px,2.6vw,12px);letter-spacing:.18em;text-transform:uppercase">
    <a href="/Craft" style="color:#efe8dc" style-hover="color:#c9a46a">Craft</a>
    <a href="/Collections" style="color:#c9a46a">Collections</a>
    <a href="/Builder" style="color:#efe8dc" style-hover="color:#c9a46a">Build a suit</a>
    <a href="/Fitting" style="color:#c9a46a;border-bottom:1px solid #c9a46a66;padding-bottom:4px" style-hover="color:#efe8dc">Book a fitting</a>
  </nav>
</header>

<section data-screen-label="Collections · Intro" style="padding:clamp(120px,12vw,150px) clamp(20px,6vw,96px) 48px;display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:32px">
  <h1 style="font-family:'Geist',sans-serif;font-weight:500;letter-spacing:-0.035em;font-size:clamp(52px,8vw,124px);line-height:.98;margin:0">Collections</h1>
  <div role="tablist" style="display:flex;flex-wrap:wrap;gap:8px">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
      <button role="tab" aria-selected="{{ t.on }}" onClick="{{ t.pick }}" style="font-family:'Geist',sans-serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:12px 20px;cursor:pointer;border:1px solid {{ t.border }};background:{{ t.bg }};color:{{ t.fg }};transition:transform 160ms ease-out,background 200ms ease-out" style-active="transform:scale(0.97)">{{ t.label }}</button>
    </sc-for>
  </div>
</section>

<section data-screen-label="Collections · Grid" style="padding:0 clamp(20px,6vw,96px) clamp(96px,12vw,160px);display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));grid-auto-flow:dense;gap:48px 24px">
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="0">
    <article style="grid-column:span {{ it.span }};display:flex;flex-direction:column;gap:16px">
      <div style="aspect-ratio:{{ it.ratio }};background:#16140f;overflow:hidden"><sc-if value="{{ it.img }}" hint-placeholder-val="{{ false }}"><img src="{{ it.img }}" alt="{{ it.name }}" style="width:100%;height:100%;object-fit:cover;object-position:{{ it.pos }};display:block;transition:transform 900ms cubic-bezier(0.23,1,0.32,1)" style-hover="transform:scale(1.03)"></img></sc-if></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap">
        <h2 style="font-family:'Geist',sans-serif;font-weight:400;font-size:26px;margin:0">{{ it.name }}</h2>
        <div style="font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#c9a46a">{{ it.price }}</div>
      </div>
      <p style="font-weight:300;font-size:15px;line-height:1.65;color:#efe8dcb3;margin:0;max-width:520px">{{ it.note }}</p>
      <div style="font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#efe8dc80">{{ it.spec }}</div>
    </article>
  </sc-for>
</section>

<section data-screen-label="Collections · Book" style="padding:clamp(96px,12vw,180px) clamp(20px,6vw,96px);background:#efe8dc;color:#0b0a08;display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:32px">
  <h2 style="font-family:'Geist',sans-serif;font-weight:500;letter-spacing:-0.035em;font-size:clamp(40px,6vw,92px);line-height:.95;margin:0;max-width:760px">See the cloth <span style="font-style:italic">in person.</span></h2>
  <a href="/Fitting" style="background:#0b0a08;color:#efe8dc;padding:20px 40px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;transition:transform 160ms ease-out,background 200ms ease-out" style-hover="background:#16140f;color:#efe8dc" style-active="transform:scale(0.97)">Book a fitting</a>
</section>

<footer style="padding:48px clamp(20px,6vw,96px);display:flex;justify-content:space-between;flex-wrap:wrap;gap:24px;font-size:13px;color:#efe8dc99;border-top:1px solid #efe8dc14">
  <div style="font-family:'Geist',sans-serif;font-size:18px;color:#efe8dc">Halden &amp; Vane</div>
  <div>14 Sackville Street, London W1</div>
  <div>Mon–Sat · 10–7</div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: 'All' };
  src(i) { return `frames/d/${String(i).padStart(3, '0')}.jpg`; }
  renderVals() {
    const all = [
      { cat: 'Suits', name: 'The Sackville', price: 'From K158,000', note: 'Our house three-piece in charcoal Prince of Wales check. Soft shoulder, high armhole, a waistcoat cut close.', spec: 'Super 130s · Full canvas · 8 weeks', img: this.src(180), pos: 'center 30%', ratio: '16/10', span: 2 },
      { cat: 'Suits', name: 'The Vane', price: 'From K139,000', note: 'Single-breasted, two-button, with a lapel that rolls to the lower button.', spec: 'Super 120s · Full canvas · 7 weeks', img: this.src(150), pos: 'center', ratio: '4/5', span: 1 },
      { cat: 'Tailoring', name: 'The waistcoat', price: 'From K31,000', note: 'Five buttons, silk back, adjustable cinch. Made to wear alone or under any jacket.', spec: 'Matched or contrast cloth', img: this.src(105), pos: 'center', ratio: '4/5', span: 1 },
      { cat: 'Tailoring', name: 'Bespoke shirts', price: 'From K10,500', note: 'Two-fold Egyptian poplin, hand-sewn collars, mother-of-pearl buttons. Minimum order of three.', spec: 'Own pattern · 4 weeks', img: this.src(60), pos: 'center', ratio: '4/5', span: 1 },
      { cat: 'Accessories', name: 'Cufflinks', price: 'From K12,500', note: 'Gold and onyx, made to commission by a Hatton Garden workshop.', spec: '18ct gold · 6 weeks', img: this.src(240), pos: 'center', ratio: '4/5', span: 1 },
      { cat: 'Accessories', name: 'Cloth library', price: 'By appointment', note: 'Over two thousand bunches from Yorkshire, Biella and the Scottish Borders.', spec: 'Worsted · Flannel · Tweed · Linen', img: this.src(215), pos: 'center', ratio: '16/10', span: 2 }
    ];
    const tab = this.state.tab;
    const tabs = ['All', 'Suits', 'Tailoring', 'Accessories'].map(l => ({ label: l, on: l === tab, pick: () => this.setState({ tab: l }), bg: l === tab ? '#efe8dc' : 'transparent', fg: l === tab ? '#0b0a08' : '#efe8dc', border: l === tab ? '#efe8dc' : '#efe8dc33' }));
    const items = tab === 'All' ? all : all.filter(x => x.cat === tab).map(x => ({ ...x, span: 1, ratio: '4/5' }));
    return { tabs, items };
  }
}
</script>
</body>
</html>
